<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Setup — PurpleBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FDFCFA; color: #14081F; min-height: 100vh; }
        .heading { font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; }
        .wrap { max-width: 680px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header p { font-size: 14px; color: #756E80; margin-top: 4px; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .badge-connected { background: rgba(16,185,129,0.1); color: #10B981; border: 1px solid rgba(16,185,129,0.25); }
        .badge-qr { background: rgba(245,158,11,0.1); color: #F59E0B; border: 1px solid rgba(245,158,11,0.25); }
        .badge-loading { background: rgba(59,130,246,0.1); color: #3B82F6; border: 1px solid rgba(59,130,246,0.25); }
        .badge-error { background: rgba(239,68,68,0.1); color: #EF4444; border: 1px solid rgba(239,68,68,0.25); }
        .badge-disconnected { background: rgba(148,163,184,0.1); color: #94A3B8; border: 1px solid rgba(148,163,184,0.25); }
        .card { background: white; border: 1px solid rgba(20,8,31,0.08); border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 12px 0; }
        .qr-wrap img { max-width: 100%; border-radius: 12px; border: 2px solid rgba(20,8,31,0.08); }
        .qr-instructions { font-size: 13px; color: #756E80; margin-bottom: 20px; line-height: 1.6; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s; }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #5B2BC9; color: white; }
        .btn-outline { background: white; color: #14081F; border: 1px solid rgba(20,8,31,0.15); }
        .btn-danger { background: white; color: #EF4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .stat-box { background: #FAF8F5; border-radius: 10px; padding: 14px 16px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: 700; color: #5B2BC9; }
        .stat-label { font-size: 11px; font-weight: 600; color: #756E80; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
        .steps { list-style: none; counter-reset: step; }
        .steps li { display: flex; gap: 12px; font-size: 13px; color: #756E80; line-height: 1.6; margin-bottom: 8px; }
        .steps li::before { counter-increment: step; content: counter(step) "."; font-weight: 700; color: #5B2BC9; min-width: 20px; }
        .center-msg { text-align: center; padding: 40px 20px; }
        .center-msg h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .center-msg p { font-size: 13px; color: #756E80; margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .icon-circle { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .success-icon { background: rgba(16,185,129,0.08); }
        .error-icon { background: #FEF2F2; }
        .error-bar { background: #FEF2F2; border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: #B91C1C; margin-bottom: 20px; }
        .auto-hint { font-size: 12px; color: #756E80; margin-top: 8px; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 520px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
        .log-panel { background: #14081F; border-radius: 12px; padding: 16px; max-height: 400px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.7; }
        .log-panel::-webkit-scrollbar { width: 6px; }
        .log-panel::-webkit-scrollbar-thumb { background: #5B2BC9; border-radius: 3px; }
        .log-line { white-space: pre-wrap; word-break: break-all; }
        .log-line .ts { color: #756E80; }
        .log-line.info { color: #A3E635; }
        .log-line.warn { color: #FBBF24; }
        .log-line.error { color: #F87171; }
        .log-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .log-filter { display: flex; gap: 6px; }
        .log-filter button { padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(20,8,31,0.15); background: white; font-size: 11px; font-weight: 600; cursor: pointer; }
        .log-filter button.active { background: #5B2BC9; color: white; border-color: #5B2BC9; }
        input:focus { border-color: #5B2BC9 !important; box-shadow: 0 0 0 2px rgba(91,43,201,0.12); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div>
                <h1 class="heading">WhatsApp Setup</h1>
                <p>Connect your WhatsApp to auto-capture leads</p>
            </div>
            <div id="statusBadge" class="badge badge-loading">Checking...</div>
        </div>
        <div id="content">
            <div class="card center-msg">
                <p>Checking connection...</p>
            </div>
        </div>

        <!-- Settings panel -->
        <div class="card" id="settingsCard" style="margin-top:24px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
                <div class="heading card-title" style="margin-bottom:0">Settings</div>
                <button class="btn btn-outline" id="settingsToggle" style="padding:4px 12px;font-size:11px">▼ Expand</button>
            </div>
            <div id="settingsBody" style="display:none">
                <div style="margin-bottom:18px">
                    <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Allowed Labels</label>
                    <p style="font-size:12px;color:#756E80;margin-bottom:8px">WhatsApp labels to read leads from. Type a label and press Enter to add.</p>
                    <div id="labelTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
                    <div style="display:flex;gap:8px">
                        <input type="text" id="labelInput" placeholder="e.g. New Customer" style="flex:1;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                        <button class="btn btn-outline" id="addLabelBtn" style="padding:6px 14px;font-size:12px">+ Add</button>
                    </div>
                </div>
                <div style="margin-bottom:18px">
                    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
                        <input type="checkbox" id="syncOnlyAllowed" style="width:16px;height:16px;accent-color:#5B2BC9" />
                        <span><strong>Sync only allowed labels</strong> — skip contacts without a matching label</span>
                    </label>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">
                    <div>
                        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Max Chats per Sync</label>
                        <input type="number" id="cfgMaxChats" min="1" max="200" style="width:100%;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                    </div>
                    <div>
                        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Messages per Chat</label>
                        <input type="number" id="cfgMsgPerChat" min="1" max="20" style="width:100%;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                    </div>
                    <div>
                        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Max Stored Messages</label>
                        <input type="number" id="cfgMaxStore" min="1" max="100" style="width:100%;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                    </div>
                    <div>
                        <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Auto-Sync Interval (ms)</label>
                        <input type="number" id="cfgSyncInterval" min="0" style="width:100%;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                        <p style="font-size:11px;color:#756E80;margin-top:3px">0 = disabled. Needs server restart.</p>
                    </div>
                </div>
                <div style="margin-bottom:18px">
                    <label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px">Default Owner Email</label>
                    <input type="email" id="cfgOwnerEmail" placeholder="admin@company.com" style="width:100%;padding:8px 12px;border:1px solid rgba(20,8,31,0.15);border-radius:8px;font-size:13px;outline:none;" />
                    <p style="font-size:11px;color:#756E80;margin-top:3px">Leads will be assigned to this user by default</p>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
                    <span id="settingsSaveStatus" style="font-size:13px;color:#10B981;align-self:center"></span>
                </div>
            </div>
        </div>

        <!-- Logs panel — always visible -->
        <div class="card" style="margin-top:24px">
            <div class="log-toolbar">
                <div class="heading card-title" style="margin-bottom:0">Logs</div>
                <div style="display:flex;gap:8px;align-items:center">
                    <div class="log-filter" id="logFilter">
                        <button class="active" data-level="">All</button>
                        <button data-level="info">Info</button>
                        <button data-level="warn">Warn</button>
                        <button data-level="error">Error</button>
                    </div>
                    <button class="btn btn-outline" id="refreshLogsBtn" style="padding:4px 10px;font-size:11px">↻ Refresh</button>
                </div>
            </div>
            <div class="log-panel" id="logPanel">
                <div class="log-line info">Loading logs...</div>
            </div>
        </div>
    </div>

<script>
const POLL_MS = 5000;
let pollTimer = null;

const svgWifi = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>`;
const svgWifiOff = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M2 2l20 20"/><path d="M5 12.859C5.79 12.15 6.68 11.56 7.65 11.1"/><path d="M16.35 11.1a10 10 0 0 1 1.65 1.76"/><path d="M2 8.82c1.48-1.37 3.18-2.44 5.03-3.17"/><path d="M16.97 5.65A15 15 0 0 1 22 8.82"/></svg>`;
const svgCheck = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>`;
const svgRefresh = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
const svgQr = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="8" height="8" rx="1"/><rect x="14" y="2" width="8" height="8" rx="1"/><rect x="2" y="14" width="8" height="8" rx="1"/><path d="M14 14h2v2h-2z"/><path d="M20 14h2v2h-2z"/><path d="M14 20h2v2h-2z"/><path d="M20 20h2v2h-2z"/><path d="M17 17h2v2h-2z"/></svg>`;

async function apiFetch(path, method = 'GET', body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST') opts.body = JSON.stringify(body || {});
    const res = await fetch('/api' + path, opts);
    return res.json();
}

function setBadge(state) {
    const el = document.getElementById('statusBadge');
    const labels = { connected: 'Connected', qr: 'Scan QR', loading: 'Loading...', error: 'Error', disconnected: 'Disconnected', unknown: 'Checking...' };
    el.textContent = labels[state] || state;
    el.className = 'badge badge-' + (state === 'unknown' ? 'loading' : state);
}

function startPoll(fn) {
    stopPoll();
    pollTimer = setInterval(fn, POLL_MS);
}
function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function checkStatus() {
    try {
        const data = await apiFetch('/status');
        return data.state || 'unknown';
    } catch { return 'error'; }
}

async function init() {
    const state = await checkStatus();
    setBadge(state);
    if (state === 'connected') showConnected();
    else if (state === 'qr' || state === 'loading') showQr();
    else showDisconnected(state === 'error' ? 'Cannot reach WhatsApp service' : '');
}

function showConnected() {
    stopPoll();
    setBadge('connected');
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
                <div class="icon-circle success-icon">${svgCheck}</div>
                <div>
                    <div class="heading card-title" style="margin-bottom:2px">WhatsApp Connected</div>
                    <div style="font-size:13px;color:#756E80">Your account is linked and ready for lead automation</div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="syncBtn">${svgRefresh} Sync Now</button>
                <button class="btn btn-danger" id="disconnectBtn">${svgWifiOff} Disconnect</button>
            </div>
        </div>
        <div id="syncResult"></div>
        <div class="card">
            <div class="heading card-title">How It Works</div>
            <ol class="steps">
                <li>WhatsApp conversations are scraped periodically from WhatsApp Web</li>
                <li>Contacts are automatically saved as <strong>Leads</strong> in your system</li>
                <li>WhatsApp <strong>labels</strong> are mapped to lead statuses (e.g. "New Customer" → qualified)</li>
                <li>Messages are stored for context when following up with leads</li>
            </ol>
        </div>
    `;
    document.getElementById('syncBtn').onclick = doSync;
    document.getElementById('disconnectBtn').onclick = doDisconnect;
}

async function showQr() {
    setBadge('qr');
    document.getElementById('content').innerHTML = `
        <div class="card">
            <div class="heading card-title">Scan QR Code</div>
            <p class="qr-instructions">Open WhatsApp on your phone → <strong>Settings</strong> → <strong>Linked Devices</strong> → <strong>Link a Device</strong> → Scan this QR code</p>
            <div class="qr-wrap" id="qrWrap"><p>Loading QR code...</p></div>
            <p class="auto-hint">Auto-checks every 5 seconds. Once scanned, the status will update automatically.</p>
        </div>
    `;
    await fetchQr();
    startPoll(async () => {
        const s = await checkStatus();
        setBadge(s);
        if (s === 'connected') { showConnected(); }
        else if (s === 'qr') { await fetchQr(); }
    });
}

async function fetchQr() {
    try {
        const data = await apiFetch('/qr');
        if (data.state === 'connected') { showConnected(); return; }
        const wrap = document.getElementById('qrWrap');
        if (data.screenshot) {
            wrap.innerHTML = `
                <img src="${data.screenshot}" alt="WhatsApp QR Code" style="max-width:400px" />
                <button class="btn btn-outline" id="refreshQrBtn">${svgRefresh} Refresh QR</button>
            `;
            document.getElementById('refreshQrBtn').onclick = fetchQr;
        } else {
            wrap.innerHTML = `<button class="btn btn-primary" id="showQrBtn">${svgQr} Show QR Code</button>`;
            document.getElementById('showQrBtn').onclick = fetchQr;
        }
    } catch (e) {
        document.getElementById('qrWrap').innerHTML = `<p style="color:#EF4444">${e.message}</p>`;
    }
}

function showDisconnected(error) {
    stopPoll();
    setBadge(error ? 'error' : 'disconnected');
    const icon = error ? `<div class="icon-circle error-icon">${svgWifiOff}</div>` : `<div class="icon-circle" style="background:#F8FAFC">${svgWifiOff}</div>`;
    document.getElementById('content').innerHTML = `
        ${error ? `<div class="error-bar">${error}</div>` : ''}
        <div class="card center-msg">
            ${icon}
            <h3 class="heading">${error ? 'Cannot Connect' : 'Not Connected'}</h3>
            <p>${error || 'Connect your WhatsApp account to start capturing leads automatically'}</p>
            <button class="btn btn-primary" id="connectBtn">${svgQr} Connect WhatsApp</button>
        </div>
    `;
    document.getElementById('connectBtn').onclick = showQr;
}

async function doSync() {
    const btn = document.getElementById('syncBtn');
    btn.disabled = true;
    btn.innerHTML = `<span class="spin">${svgRefresh}</span> Syncing...`;
    try {
        const data = await apiFetch('/sync', 'POST');
        document.getElementById('syncResult').innerHTML = `
            <div class="card">
                <div class="heading card-title">Last Sync Result</div>
                <div class="stat-grid">
                    <div class="stat-box"><div class="stat-val heading">${data.scrapedCount ?? 0}</div><div class="stat-label">Scraped</div></div>
                    <div class="stat-box"><div class="stat-val heading">${data.createdLeads ?? 0}</div><div class="stat-label">New Leads</div></div>
                    <div class="stat-box"><div class="stat-val heading">${data.updatedLeads ?? 0}</div><div class="stat-label">Updated</div></div>
                    <div class="stat-box"><div class="stat-val heading">${data.savedMessages ?? 0}</div><div class="stat-label">Messages</div></div>
                </div>
            </div>
        `;
    } catch (e) {
        document.getElementById('syncResult').innerHTML = `<div class="error-bar">${e.message}</div>`;
    }
    btn.disabled = false;
    btn.innerHTML = `${svgRefresh} Sync Now`;
}

async function doDisconnect() {
    const btn = document.getElementById('disconnectBtn');
    btn.disabled = true;
    btn.textContent = 'Disconnecting...';
    try {
        await apiFetch('/disconnect', 'POST');
        showDisconnected('');
    } catch (e) {
        alert(e.message);
        btn.disabled = false;
        btn.innerHTML = `${svgWifiOff} Disconnect`;
    }
}

// ── Logs ─────────────────────────────────────────────────────────────────────
let currentLogLevel = '';
let logPollTimer = null;

async function fetchLogs(level) {
    try {
        const q = level ? `?level=${level}&limit=200` : '?limit=200';
        const data = await apiFetch('/logs' + q);
        const panel = document.getElementById('logPanel');
        if (!data.logs || data.logs.length === 0) {
            panel.innerHTML = '<div class="log-line info">No logs yet.</div>';
            return;
        }
        panel.innerHTML = data.logs.map(l => {
            const ts = l.ts.replace('T', ' ').replace('Z', '').slice(0, 19);
            return `<div class="log-line ${l.level}"><span class="ts">[${ts}]</span> ${escHtml(l.msg)}</div>`;
        }).join('');
        panel.scrollTop = panel.scrollHeight;
    } catch (e) {
        document.getElementById('logPanel').innerHTML = `<div class="log-line error">Failed to load logs: ${escHtml(e.message)}</div>`;
    }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setupLogControls() {
    document.getElementById('refreshLogsBtn').onclick = () => fetchLogs(currentLogLevel);
    document.querySelectorAll('#logFilter button').forEach(btn => {
        btn.onclick = () => {
            currentLogLevel = btn.dataset.level;
            document.querySelectorAll('#logFilter button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLogs(currentLogLevel);
        };
    });
    // Auto-refresh logs every 10 seconds
    logPollTimer = setInterval(() => fetchLogs(currentLogLevel), 10000);
}

setupLogControls();
fetchLogs('');

// ── Settings ────────────────────────────────────────────────────────────────
let settingsLabels = [];

document.getElementById('settingsToggle').onclick = () => {
    const body = document.getElementById('settingsBody');
    const btn = document.getElementById('settingsToggle');
    if (body.style.display === 'none') {
        body.style.display = 'block';
        btn.textContent = '▲ Collapse';
        loadSettings();
    } else {
        body.style.display = 'none';
        btn.textContent = '▼ Expand';
    }
};

function renderLabelTags() {
    const container = document.getElementById('labelTags');
    container.innerHTML = settingsLabels.map((l, i) =>
        `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(91,43,201,0.08);color:#5B2BC9;border-radius:6px;font-size:12px;font-weight:600">
            ${escHtml(l)}
            <button onclick="removeLabel(${i})" style="border:none;background:none;color:#5B2BC9;cursor:pointer;font-size:14px;line-height:1;padding:0 2px">&times;</button>
        </span>`
    ).join('');
}

window.removeLabel = function(i) {
    settingsLabels.splice(i, 1);
    renderLabelTags();
};

document.getElementById('addLabelBtn').onclick = addLabel;
document.getElementById('labelInput').onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addLabel(); }
};

function addLabel() {
    const input = document.getElementById('labelInput');
    const val = input.value.trim();
    if (val && !settingsLabels.includes(val)) {
        settingsLabels.push(val);
        renderLabelTags();
    }
    input.value = '';
    input.focus();
}

async function loadSettings() {
    try {
        const data = await apiFetch('/settings');
        if (!data.ok) return;
        const s = data.settings;
        settingsLabels = s.allowedLabels || [];
        renderLabelTags();
        document.getElementById('syncOnlyAllowed').checked = s.syncOnlyAllowedLabels || false;
        document.getElementById('cfgMaxChats').value = s.maxChats || 15;
        document.getElementById('cfgMsgPerChat').value = s.messagesPerChat || 10;
        document.getElementById('cfgMaxStore').value = s.maxStoreMessages || 10;
        document.getElementById('cfgSyncInterval').value = s.syncIntervalMs || 0;
        document.getElementById('cfgOwnerEmail').value = s.defaultOwnerEmail || '';
    } catch (e) {
        console.error('Failed to load settings:', e.message);
    }
}

document.getElementById('saveSettingsBtn').onclick = async () => {
    const btn = document.getElementById('saveSettingsBtn');
    const status = document.getElementById('settingsSaveStatus');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    status.textContent = '';
    try {
        const body = {
            allowedLabels: settingsLabels,
            syncOnlyAllowedLabels: document.getElementById('syncOnlyAllowed').checked,
            maxChats: Number(document.getElementById('cfgMaxChats').value) || 15,
            messagesPerChat: Number(document.getElementById('cfgMsgPerChat').value) || 10,
            maxStoreMessages: Number(document.getElementById('cfgMaxStore').value) || 10,
            syncIntervalMs: Number(document.getElementById('cfgSyncInterval').value) || 0,
            defaultOwnerEmail: document.getElementById('cfgOwnerEmail').value.trim(),
        };
        const res = await fetch('/api/settings', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.ok) {
            status.style.color = '#10B981';
            status.textContent = '✓ Saved';
        } else {
            status.style.color = '#EF4444';
            status.textContent = data.error || 'Save failed';
        }
    } catch (e) {
        status.style.color = '#EF4444';
        status.textContent = e.message;
    }
    btn.disabled = false;
    btn.textContent = 'Save Settings';
    setTimeout(() => { status.textContent = ''; }, 3000);
};

init();
</script>
</body>
</html>
