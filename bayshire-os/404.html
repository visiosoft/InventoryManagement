<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Page not found | 2Capacity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{ --bg:#FFFFFF; --ink:#1F1F1F; --ink2:#4A4D51; --accent:#34A853; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#131314; --ink:#E3E3E3; --ink2:#BDC0C4; --accent:#6DD58C; } }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif; padding:24px; text-align:center; }
  h1{ font-size:clamp(28px,6vw,44px); margin:0 0 12px; }
  p{ color:var(--ink2); margin:0 0 24px; }
  a.btn{ display:inline-block; padding:12px 22px; border-radius:999px; background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; }
  a.btn:hover{ background:var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you were looking for isn't here.</p>
    <a class="btn" href="/">Go to the 2Capacity homepage</a>
  </main>
</body>
</html>
