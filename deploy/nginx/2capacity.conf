# 2capacity.com — nginx 1.24 on the Contabo VPS (169.58.30.119)
#
# Replaces the current site config, whose `try_files ... /index.html` fallback
# answered every unknown path (robots.txt, sitemap.xml, favicon.ico, typos)
# with the homepage and a 200 — "soft 404s" to Google.
#
# Apply:
#   ls /etc/nginx/sites-enabled/                       # find the current file
#   sudo cp /etc/nginx/sites-available/<file> ~/<file>.bak
#   # set `root` below to the folder that holds the site's index.html today
#   sudo cp 2capacity.conf /etc/nginx/sites-available/<file>
#   sudo nginx -t && sudo systemctl reload nginx
#
# Needs DNS first for www: an A record `www -> 169.58.30.119` at GoDaddy.
# The existing Let's Encrypt certificate already covers www.
#
# Check afterwards (expected result in the comment):
#   curl -sI https://2capacity.com/robots.txt        # 200, text/plain
#   curl -sI https://2capacity.com/sitemap.xml       # 200, application/xml
#   curl -sI https://2capacity.com/does-not-exist    # 404
#   curl -sI https://2capacity.com/favicon.ico       # 200, image/x-icon
#   curl -sI http://2capacity.com/                   # 301 -> https://2capacity.com/
#   curl -sI https://www.2capacity.com/              # 301 -> https://2capacity.com/
#   curl -sI https://2capacity.com/                  # 200, not a redirect
#   curl -sI https://2capacity.com/index.html        # 301 -> https://2capacity.com/
#   curl -sI https://2capacity.com/ar                # 301 -> https://2capacity.com/ar/
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' \
#        -d '{}' https://2capacity.com/api/demo-requests   # 400 (reached the API, empty form)

# 1) http (apex + www) -> https apex, one hop
server {
    listen 80;
    server_name 2capacity.com www.2capacity.com;
    return 301 https://2capacity.com$request_uri;
}

# 2) https www -> https apex
server {
    listen 443 ssl http2;   # nginx 1.24 syntax (`http2 on;` needs 1.25.1+)
    server_name www.2capacity.com;
    ssl_certificate     /etc/letsencrypt/live/2capacity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2capacity.com/privkey.pem;
    # If your old file has certbot lines like these, keep them:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://2capacity.com$request_uri;
}

# 3) the site
server {
    listen 443 ssl http2;   # nginx 1.24 syntax (`http2 on;` needs 1.25.1+)
    server_name 2capacity.com;
    ssl_certificate     /etc/letsencrypt/live/2capacity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2capacity.com/privkey.pem;
    # If your old file has certbot lines like these, keep them:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/2capacity;   # <-- the folder with index.html, robots.txt, sitemap.xml
    index index.html;
    charset utf-8;

    # /index.html and /index.htm -> / (301), keeping any query string. This tests
    # $request_uri, the address the browser asked for. `location = /index.html`
    # must not be used here: `index` rewrites / to /index.html internally, so that
    # location would catch the homepage too and redirect it to itself forever.
    if ($request_uri ~ "^/index\.html?(\?|$)") {
        return 301 https://2capacity.com/$is_args$args;
    }

    # Demo form. Straight to the Node process, not through demoapi.purplebox.ae:
    # a second nginx hop would put this server's IP in X-Forwarded-For, and every
    # visitor would then share the API's limit of 5 requests per 10 minutes.
    # Replace DEMO_API_PORT with the port from this command (nginx -t fails until then):
    #   sudo nginx -T | grep -A12 'server_name demoapi.purplebox.ae' | grep proxy_pass
    location = /api/demo-requests {
        proxy_pass http://127.0.0.1:DEMO_API_PORT/api/public/demo-requests;
        proxy_set_header Host demoapi.purplebox.ae;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://2capacity.com" always;
        include /etc/nginx/snippets/2capacity-headers.conf;
    }

    # Real files only. Navigation is all #anchors, so no SPA fallback is needed.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt  { default_type text/plain;      try_files $uri =404; }
    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }

    # Let's Encrypt renewals must keep working (checked before the rule below)
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }

    # Source files that sit next to the site but are not part of it
    location ~ (^/\.|\.py$|\.md$|\.docx$) { return 404; }

    # Long cache for media and fonts; scripts and styles revalidate so a
    # release shows up immediately (their filenames are not versioned)
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/2capacity-headers.conf;
    }
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /etc/nginx/snippets/2capacity-headers.conf;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/2capacity-headers.conf;
}

# ---------------------------------------------------------------------------
# /etc/nginx/snippets/2capacity-headers.conf  (create this file too)
# A location with its own add_header drops the server-level ones, hence a
# snippet included in each.
#
#   add_header Strict-Transport-Security "max-age=31536000" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header X-Frame-Options "SAMEORIGIN" always;
#   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-GsdRrTY+ngu7XlohvHy3zATrPuPRInz0GZHSKckjk6A=' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.googleadservices.com https://*.doubleclick.net https://*.google.com; font-src 'self'; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
#
# The sha256 in script-src is the inline theme script in each page's <head>. If
# that script changes, the hash must change with it or the theme stops applying.
# ---------------------------------------------------------------------------
