[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://api.purplebox.ae/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://api.purplebox.ae/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  # A static site of its own, served as-is from client/public/bayshire-os —
  # without this it falls through to the SPA catch-all below (which is
  # `force`d, so it wins over the real files even though they exist) and
  # every /bayshire-os/* request serves the React app's index.html instead.
  # The bare path (no trailing slash) doesn't match the "/*" wildcard below,
  # so it needs its own exact rule pointing at the actual file.
  from = "/bayshire-os"
  to = "/bayshire-os/index.html"
  status = 200

[[redirects]]
  from = "/bayshire-os/*"
  to = "/bayshire-os/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
